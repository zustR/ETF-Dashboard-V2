name: Generate Posit Connect Cloud manifest

on:
  push:
    branches:
      - feat/shinyapps-deployment
      - feat/fundamental-opportunity-analysis
      - feat/sec-automatic-fundamentals
    paths:
      - app.R
      - R/**
      - .github/workflows/connect-cloud-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Linux system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R packages for deployment
        run: Rscript -e 'install.packages(c("shiny", "quantmod", "httr2", "jsonlite", "rsconnect"), repos=Sys.getenv("RSPM", "https://cloud.r-project.org")); stopifnot(requireNamespace("rsconnect", quietly=TRUE), requireNamespace("shiny", quietly=TRUE), requireNamespace("quantmod", quietly=TRUE))'
      - name: Generate manifest.json
        run: Rscript -e 'rsconnect::writeManifest(appDir=".", appFiles=c("app.R","R/risk.R","R/scanner.R","R/fundamentals.R","R/sec_fundamentals.R"), appPrimaryDoc="app.R", appMode="shiny")'
      - name: Commit manifest to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Connect Cloud dependency manifest"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "Remote branch changed while publishing manifest (attempt $attempt)."
            done
            echo "::error::Could not publish manifest after 3 attempts."
            exit 1
          fi
