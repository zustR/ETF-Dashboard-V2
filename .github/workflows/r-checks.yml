name: R Shiny checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages("shiny", repos="https://cloud.r-project.org")'
      - name: Check R syntax
        run: Rscript -e 'parse(file="app.R"); parse(file="R/risk.R"); parse(file="tests/run_tests.R")'
      - name: Run financial calculation tests
        run: Rscript tests/run_tests.R
