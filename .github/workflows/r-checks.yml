name: R Shiny checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("shiny", "quantmod"), repos="https://cloud.r-project.org")'
      - name: Check R syntax and score inputs
        run: Rscript -e 'parse(file="app.R"); parse(file="R/risk.R"); parse(file="R/scanner.R"); parse(file="R/fundamentals.R"); parse(file="R/sec_fundamentals.R"); parse(file="tests/run_tests.R")'
      - name: Run financial calculation tests
        run: Rscript tests/run_tests.R && Rscript tests/scanner_tests.R && Rscript tests/fundamentals_tests.R && Rscript tests/sec_fundamentals_tests.R
